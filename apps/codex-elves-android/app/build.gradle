import groovy.json.JsonOutput
import java.security.MessageDigest

plugins {
    id "com.android.application"
}

def repositoryRoot = rootProject.projectDir.toPath().resolve("../..").normalize().toFile()
def versionFile = rootProject.file("version.properties")
def versionProperties = new Properties()
if (!versionFile.isFile()) {
    throw new GradleException("缺少 Android 独立版本文件：version.properties")
}
versionFile.withReader("UTF-8") { versionProperties.load(it) }
def productVersion = versionProperties.getProperty("versionName", "").trim()
def versionCodeText = versionProperties.getProperty("versionCode", "").trim()
if (!(productVersion ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/) ||
    !(versionCodeText ==~ /[1-9][0-9]*/)) {
    throw new GradleException("version.properties 必须包含有效的 versionName 和 versionCode")
}
def androidVersionCode
try {
    androidVersionCode = Integer.parseInt(versionCodeText)
} catch (NumberFormatException ignored) {
    throw new GradleException("Android versionCode 超出整数范围")
}
if (androidVersionCode < 2 || androidVersionCode > 2100000000) {
    throw new GradleException("Android versionCode 必须在 2 到 2100000000 之间，并在每次正式发布时递增")
}

def signingNames = [
    storeFile: "CODEX_ELVES_ANDROID_KEYSTORE",
    storePassword: "CODEX_ELVES_ANDROID_STORE_PASSWORD",
    keyAlias: "CODEX_ELVES_ANDROID_KEY_ALIAS",
    keyPassword: "CODEX_ELVES_ANDROID_KEY_PASSWORD"
]
def signingValues = signingNames.collectEntries { key, envName -> [(key): System.getenv(envName)] }
def hasReleaseSigning = signingValues.values().every { it != null && !it.isBlank() }

android {
    namespace "com.junxin367.codexelves"
    compileSdk 35

    defaultConfig {
        applicationId "com.junxin367.codexelves"
        minSdk 26
        targetSdk 35
        versionCode androidVersionCode
        versionName productVersion

        buildConfigField "int", "SHELL_VERSION", "1"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

}

def generatedWebAssets = layout.buildDirectory.dir("generated/webAssets")
def remoteAssets = new File(repositoryRoot, "assets/remote-access")
def resourceRevisionFile = new File(remoteAssets, "resource-revision.txt")

// 内置网页包按 scripts/remote-access-resources.mjs 的统一规则扫描 assets/remote-access 生成：
// 按扩展名确定 MIME，index.html 提供为 "/"，缓存恢复页独立提供、不进入版本清单。
// 新增或拆分网页模块无需在此登记；规则变化须同步服务端 build.rs、Windows 客户端 build.rs 与调试服务器。
def remoteResourceContentTypes = [
    "html": "text/html; charset=utf-8",
    "js": "application/javascript; charset=utf-8",
    "mjs": "application/javascript; charset=utf-8",
    "css": "text/css; charset=utf-8",
    "png": "image/png",
    "webmanifest": "application/manifest+json; charset=utf-8"
]
def separatelyServedResources = ["cache-recovery.html", "cache-recovery.js"]
def bundledWebResources = {
    def resources = []
    remoteAssets.eachFileRecurse(groovy.io.FileType.FILES) { file ->
        def source = remoteAssets.toPath().relativize(file.toPath()).toString().replace(File.separatorChar, '/' as char)
        def dot = source.lastIndexOf('.')
        def contentType = dot > source.lastIndexOf('/') ? remoteResourceContentTypes[source.substring(dot + 1)] : null
        if (contentType == null || separatelyServedResources.contains(source)) return
        resources << [source: source, path: source == "index.html" ? "/" : "/" + source, contentType: contentType]
    }
    resources.sort { a, b -> a.path <=> b.path }
}

def unsignedLongBigEndian = { long value ->
    byte[] result = new byte[8]
    for (int index = 7; index >= 0; index--) {
        result[index] = (byte) (value & 0xff)
        value >>>= 8
    }
    result
}

def updateVersionField = { MessageDigest digest, byte[] value ->
    digest.update(unsignedLongBigEndian(value.length))
    digest.update(value)
}

tasks.register("prepareBundledWebAssets") {
    inputs.dir(remoteAssets)
    outputs.dir(generatedWebAssets)

    doLast {
        if (!resourceRevisionFile.isFile()) {
            throw new GradleException("缺少 Android 网页资源 revision：${resourceRevisionFile}")
        }
        def resourceRevisionText = resourceRevisionFile.getText("UTF-8").trim()
        if (!(resourceRevisionText ==~ /[1-9][0-9]{0,18}/)) {
            throw new GradleException("Android 网页资源 revision 无效：${resourceRevisionText}")
        }
        def resourceRevision = resourceRevisionText.toLong()
        def outputRoot = generatedWebAssets.get().asFile
        delete(outputRoot)
        def filesRoot = new File(outputRoot, "web/files")
        filesRoot.mkdirs()

        def entries = bundledWebResources().collect { resource ->
            def source = new File(remoteAssets, resource.source)
            if (!source.isFile()) {
                throw new GradleException("缺少 Android 内置网页资源：${resource.source}")
            }
            def target = new File(filesRoot, resource.source)
            target.parentFile.mkdirs()
            target.bytes = source.bytes

            def digest = MessageDigest.getInstance("SHA-256").digest(source.bytes).encodeHex().toString()
            [
                path: resource.path,
                contentType: resource.contentType,
                size: source.length(),
                sha256: digest
            ]
        }
        entries.sort { a, b -> a.path <=> b.path }

        def versionDigest = MessageDigest.getInstance("SHA-256")
        entries.each { entry ->
            updateVersionField(versionDigest, entry.path.getBytes("UTF-8"))
            updateVersionField(versionDigest, entry.contentType.getBytes("UTF-8"))
            versionDigest.update(unsignedLongBigEndian(entry.size))
            updateVersionField(versionDigest, entry.sha256.getBytes("UTF-8"))
        }
        def manifest = [
            schemaVersion: 1,
            minShellVersion: 1,
            revision: resourceRevision,
            version: versionDigest.digest().encodeHex().toString(),
            files: entries
        ]
        def manifestFile = new File(outputRoot, "web/app-resources.json")
        manifestFile.parentFile.mkdirs()
        manifestFile.setText(JsonOutput.toJson(manifest), "UTF-8")
    }
}

android.sourceSets.main.assets.srcDir(generatedWebAssets)
tasks.named("preBuild").configure {
    dependsOn("prepareBundledWebAssets")
}

dependencies {
    implementation "androidx.webkit:webkit:1.17.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
