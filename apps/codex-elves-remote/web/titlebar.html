<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CodexElves 远程会话标题栏</title>
  <link rel="stylesheet" href="titlebar.css">
  <script type="module" src="titlebar.js"></script>
</head>
<body>
  <header class="titlebar" aria-label="程序标题栏">
    <div class="titlebar-drag" data-tauri-drag-region>
      <img src="icon.png" alt="" draggable="false" data-tauri-drag-region>
      <span data-tauri-drag-region>CodexElves 远程会话</span>
    </div>
    <div class="titlebar-controls">
      <button id="minimize" type="button" aria-label="最小化" title="最小化">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 6h10"/></svg>
      </button>
      <button id="maximize" type="button" aria-label="最大化" title="最大化">
        <svg class="maximize-icon" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9"/></svg>
        <svg class="restore-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 3V1.5h6.5V8H9"/><rect x="1.5" y="4" width="6.5" height="6.5"/></svg>
      </button>
      <button id="close" type="button" aria-label="关闭到托盘" title="关闭到托盘">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m1.5 1.5 9 9m0-9-9 9"/></svg>
      </button>
    </div>
  </header>
</body>
</html>
