<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CodexElves 远程会话</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <div class="brand">✦ CodexElves <span>Remote</span></div>
    <h1>连接远程会话</h1>
    <p class="intro">这里填写电脑端已启用的远程服务地址；访问密钥在连接后的登录页输入。</p>
    <form id="connection-form">
      <label for="server-url">服务地址</label>
      <input id="server-url" type="text" inputmode="url" maxlength="2048" placeholder="https://你的远程服务地址" autocomplete="url" spellcheck="false" required autofocus>
      <button id="connect" type="submit" disabled>连接</button>
    </form>
    <p id="status" role="status" aria-live="polite">正在读取连接设置…</p>
    <div class="window-help">
      <p>窗口可自由调整大小、最小化和最大化。</p>
      <p>关闭窗口后收进托盘；通过托盘可重新打开、修改连接地址或退出。</p>
    </div>
    <footer><span>Windows 远程客户端</span><span id="version"></span></footer>
  </main>
</body>
</html>
