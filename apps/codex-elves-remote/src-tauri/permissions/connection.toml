[[permission]]
identifier = "remote-connection"
description = "内置连接页可以读取远程客户端设置并连接指定服务。"
commands.allow = ["remote_client_state", "connect_remote"]

[[permission]]
identifier = "remote-appearance"
description = "当前服务仅可同步经过校验的原生应用顶栏 RGB 配色，不可操作窗口或修改连接设置。"
commands.allow = ["remote_titlebar_theme"]

[[permission]]
identifier = "remote-taskbar-badge"
description = "当前服务的主窗口仅可同步未读会话数字角标，不可操作窗口或修改连接设置。"
commands.allow = ["remote_unread_badge"]

[[permission]]
identifier = "remote-resource-cache"
description = "当前服务只可查看/检查公开网页资源缓存并告知前台忙碌状态，不可改变服务地址或读取设备凭据。"
commands.allow = ["remote_cache_status", "remote_cache_refresh", "remote_cache_activity"]

[[permission]]
identifier = "remote-session-window"
description = "当前服务可打开同来源的会话或文件预览窗口，不可指定任意地址、读取本机文件或控制其他窗口。"
commands.allow = ["remote_open_session_window"]
