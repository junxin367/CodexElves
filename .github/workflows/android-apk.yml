name: Android APK
run-name: Android ${{ inputs.tag || github.ref_name }} ${{ inputs.configuration || 'Release' }}

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "apps/codex-elves-android/**"
      - "!apps/codex-elves-android/**/build/**"
      - "!apps/codex-elves-android/.gradle/**"
      - "!apps/codex-elves-android/local.properties"
      - "assets/remote-access/**"
      - "scripts/*android*.ps1"
      - "build.ps1"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      configuration:
        description: APK 类型；Release 必须使用既有正式签名
        required: true
        type: choice
        options: [Debug, Release]
        default: Release
      tag:
        description: 可选 Git ref；Release 填 android-v<独立版本> 时发布，留空只生成产物
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: android-apk-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  debug:
    name: Build Android debug APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration == 'Debug' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build debug APK and lint
        shell: pwsh
        run: .\scripts\build-android.ps1 -Configuration Debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: CodexElves-android-debug
          path: dist/android/CodexElves-*-android-debug.apk
          if-no-files-found: error

  release:
    name: Build signed Android release APK
    if: ${{ github.event_name == 'push' || inputs.configuration == 'Release' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate Android version, tag and signing secrets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || inputs.tag }}
          CODEX_ELVES_ANDROID_KEYSTORE_BASE64: ${{ secrets.CODEX_ELVES_ANDROID_KEYSTORE_BASE64 }}
          CODEX_ELVES_ANDROID_STORE_PASSWORD: ${{ secrets.CODEX_ELVES_ANDROID_STORE_PASSWORD }}
          CODEX_ELVES_ANDROID_KEY_ALIAS: ${{ secrets.CODEX_ELVES_ANDROID_KEY_ALIAS }}
          CODEX_ELVES_ANDROID_KEY_PASSWORD: ${{ secrets.CODEX_ELVES_ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          . .\scripts\android-build-common.ps1
          $version = Get-AndroidVersion -RepositoryRoot $PWD.Path
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -cne $version.Tag) {
            throw "发布标签必须与 Android 独立版本一致：$($version.Tag)"
          }
          $requiredSecrets = @(
            "CODEX_ELVES_ANDROID_KEYSTORE_BASE64",
            "CODEX_ELVES_ANDROID_STORE_PASSWORD",
            "CODEX_ELVES_ANDROID_KEY_ALIAS",
            "CODEX_ELVES_ANDROID_KEY_PASSWORD"
          )
          $missingSecrets = @($requiredSecrets | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missingSecrets.Count -gt 0) {
            throw "Release 构建缺少必需的 Actions secrets：$($missingSecrets -join ', ')"
          }
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Prepare temporary signing keystore
        shell: pwsh
        env:
          CODEX_ELVES_ANDROID_KEYSTORE_BASE64: ${{ secrets.CODEX_ELVES_ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $keystoreBytes = [Convert]::FromBase64String($env:CODEX_ELVES_ANDROID_KEYSTORE_BASE64)
          } catch {
            throw "CODEX_ELVES_ANDROID_KEYSTORE_BASE64 不是有效的 Base64 内容。"
          }
          if ($keystoreBytes.Length -eq 0) { throw "签名 keystore 内容为空。" }
          $keystorePath = Join-Path $env:RUNNER_TEMP "codex-elves-android-signing-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).jks"
          [System.IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)
          "CODEX_ELVES_ANDROID_KEYSTORE=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build signed release APK, lint and update manifest
        shell: pwsh
        env:
          CODEX_ELVES_ANDROID_STORE_PASSWORD: ${{ secrets.CODEX_ELVES_ANDROID_STORE_PASSWORD }}
          CODEX_ELVES_ANDROID_KEY_ALIAS: ${{ secrets.CODEX_ELVES_ANDROID_KEY_ALIAS }}
          CODEX_ELVES_ANDROID_KEY_PASSWORD: ${{ secrets.CODEX_ELVES_ANDROID_KEY_PASSWORD }}
        run: .\scripts\build-android.ps1 -Configuration Release
      - name: Upload release APK and update manifest
        uses: actions/upload-artifact@v6
        with:
          name: CodexElves-android-release
          path: |
            dist/android/CodexElves-*-android.apk
            dist/android/android-update.json
            dist/android/build-state.json
          if-no-files-found: error
      - name: Remove temporary signing keystore
        if: always()
        shell: pwsh
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP "codex-elves-android-signing-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT).jks"
          if (Test-Path -LiteralPath $keystorePath -PathType Leaf) {
            Remove-Item -LiteralPath $keystorePath -Force
          }

  publish:
    name: Publish independent Android Release
    needs: release
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')) || (github.event_name == 'workflow_dispatch' && inputs.configuration == 'Release' && startsWith(inputs.tag, 'android-v')) }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Android tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Download signed release artifacts
        uses: actions/download-artifact@v6
        with:
          name: CodexElves-android-release
          path: dist/android
      - name: Validate and publish APK with update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # --latest=false 对应 Releases API 的 make_latest=false，不改变桌面 Latest。
          .\scripts\publish-android-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
