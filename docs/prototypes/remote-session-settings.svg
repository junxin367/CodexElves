      .text{fill:#202733}
      .muted{fill:#7b8492}
      .icon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .tiny{font-size:10px}.small{font-size:11px}.body{font-size:13px}
    </style>
  </defs>

